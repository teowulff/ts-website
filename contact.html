<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact — Teo Stoll</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="stage">
  <nav class="nav">
    <a href="index.html">Home</a>
    <a href="resume.html">Resume</a>
    <a href="projects.html">Projects</a>
    <a href="contact.html" aria-current="page">Contact</a>
  </nav>

  <header class="hero" style="padding-bottom: 56px;">
    <p class="eyebrow">Get In Touch</p>
    <h1 style="font-size: clamp(36px, 7vw, 64px);">Contact</h1>
    <p class="contact-line">
      <span>703.868.8177</span>
      <span>&middot;</span>
      <span>teo.stoll@gmail.com</span>
    </p>
  </header>
</div>

<main class="section">

  <h2 class="section-title">Contact Me</h2>

  <!--
    NOTE: This form has no backend. To actually receive submissions once
    hosted, either:
      (a) point the form at a service like Formspree / Getform / Netlify
          Forms and set the "action" attribute to the URL they give you, or
      (b) swap this for a mailto: link.
    Netlify Forms is the easiest if you deploy there — just add the
    data-netlify="true" attribute to the <form> tag.
  -->
  <form action="#" method="POST">

    <div class="field-group">
      <label>Name</label>
      <div class="field-row">
        <div class="field">
          <label for="first-name" style="font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em;">
            First Name<span class="required-tag">(Required)</span>
          </label>
          <input type="text" id="first-name" name="first-name" required>
        </div>
        <div class="field">
          <label for="last-name" style="font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em;">
            Last Name<span class="required-tag">(Required)</span>
          </label>
          <input type="text" id="last-name" name="last-name" required>
        </div>
      </div>
    </div>

    <div class="field-group">
      <label for="email">Email Address<span class="required-tag">(Required)</span></label>
      <input type="email" id="email" name="email" required>
    </div>

    <div class="field-group">
      <label for="subject">Subject<span class="required-tag">(Required)</span></label>
      <input type="text" id="subject" name="subject" required>
    </div>

    <div class="field-group">
      <label for="message">Message<span class="required-tag">(Required)</span></label>
      <textarea id="message" name="message" required></textarea>
    </div>

    <button type="submit" class="submit-btn">Submit</button>

  </form>

</main>

<footer>&copy; 2026 Teo Stoll</footer>

</body>
</html>
